name: Deploy to GitHub Pages

# 작업 브랜치에 푸시되면 사이트 파일을 gh-pages 브랜치로 발행합니다.
# GitHub Pages는 gh-pages 브랜치(루트)를 소스로 사용합니다.
on:
  push:
    branches:
      - main
      - claude/blissful-ritchie-13qskz
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html questions.js README.md .nojekyll _site/
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "Deploy ${{ github.sha }}"
