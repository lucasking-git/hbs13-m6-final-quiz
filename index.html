<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBS13 재무 Final Test</title>
<meta name="description" content="HBS 13기 6모듈 재무 Final Test 연습 퀴즈">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --surface-2: #eef1f6;
    --text: #1b2230;
    --muted: #64708a;
    --border: #d9dee8;
    --primary: #2f5bea;
    --primary-text: #ffffff;
    --correct: #1e8e5a;
    --correct-bg: #e4f5ec;
    --wrong: #d3432f;
    --wrong-bg: #fbe9e6;
    --warn-bg: #fff6e0;
    --warn: #9a6500;
    --shadow: 0 2px 10px rgba(20, 30, 60, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161f;
      --surface: #1b2130;
      --surface-2: #232b3d;
      --text: #e7ebf3;
      --muted: #9aa5bd;
      --border: #333d52;
      --primary: #6b8cff;
      --primary-text: #0d1220;
      --correct: #4fce8f;
      --correct-bg: #173327;
      --wrong: #ff7b68;
      --wrong-bg: #3a1f1b;
      --warn-bg: #3a2f14;
      --warn: #ffcf6b;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161f;
    --surface: #1b2130;
    --surface-2: #232b3d;
    --text: #e7ebf3;
    --muted: #9aa5bd;
    --border: #333d52;
    --primary: #6b8cff;
    --primary-text: #0d1220;
    --correct: #4fce8f;
    --correct-bg: #173327;
    --wrong: #ff7b68;
    --wrong-bg: #3a1f1b;
    --warn-bg: #3a2f14;
    --warn: #ffcf6b;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  .container { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 1.45rem; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .hidden { display: none !important; }
  label { display: block; font-weight: 500; margin-bottom: 8px; }
  input[type="password"], input[type="text"], textarea {
    width: 100%;
    font: inherit;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
  }
  input:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  textarea { min-height: 90px; resize: vertical; }
  .btn {
    display: inline-block;
    font: inherit;
    font-weight: 500;
    padding: 11px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    transition: transform 0.05s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn-row .grow { flex: 1; }
  .error { color: var(--wrong); font-size: 0.9rem; margin-top: 8px; min-height: 1.4em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .stat { background: var(--surface-2); border-radius: 10px; padding: 12px 8px; text-align: center; }
  .stat .num { font-size: 1.4rem; font-weight: 700; }
  .stat .lbl { color: var(--muted); font-size: 0.8rem; }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 0.9rem; }
  .option-group { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .radio-line { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 400; }
  .radio-line input { width: auto; }

  .progress-wrap { display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; color: var(--muted); margin-bottom: 8px; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
  .bar > div { height: 100%; background: var(--primary); width: 0; transition: width 0.25s; }
  .q-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { font-size: 0.75rem; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 500; }
  .badge.type { background: var(--primary); color: var(--primary-text); }
  .q-text { font-size: 1.08rem; font-weight: 500; white-space: pre-wrap; margin: 6px 0 4px; }
  .q-note { font-size: 0.85rem; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .choice {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px;
    background: var(--surface); cursor: pointer; text-align: left; font: inherit; color: var(--text);
    width: 100%;
  }
  .choice:hover:not(:disabled) { border-color: var(--primary); }
  .choice .mark { font-weight: 700; color: var(--primary); flex-shrink: 0; }
  .choice.selected { border-color: var(--primary); background: var(--surface-2); }
  .choice.correct { border-color: var(--correct); background: var(--correct-bg); }
  .choice.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .choice:disabled { cursor: default; }
  .result-line { margin-top: 14px; font-weight: 700; }
  .result-line.ok { color: var(--correct); }
  .result-line.ng { color: var(--wrong); }
  .explain {
    margin-top: 12px; padding: 14px; border-radius: 10px; background: var(--surface-2);
    white-space: pre-wrap; font-size: 0.95rem;
  }
  .explain strong { display: block; margin-bottom: 4px; }
  .selfgrade { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }

  .review-item { border-top: 1px solid var(--border); padding: 14px 0; }
  .review-item:first-child { border-top: none; }
  .review-item .rq { font-weight: 500; white-space: pre-wrap; }
  .review-item .ra { font-size: 0.92rem; margin-top: 4px; }
  .review-item .ra span { font-weight: 700; }
  .score-big { font-size: 2.4rem; font-weight: 700; text-align: center; margin: 6px 0; }
  .score-sub { text-align: center; color: var(--muted); margin-bottom: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 24px; }
  .link-btn { background: none; border: none; color: var(--primary); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
  .slot-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
  .slot { text-align: center; font-size: 0.8rem; padding: 6px 0; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
  .slot.ok { background: var(--correct-bg); color: var(--correct); font-weight: 700; }
  .slot.short { border: 1px dashed var(--border); }

  .nav-strip { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .nav-dot {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--muted); font: inherit; font-size: 0.78rem;
    cursor: pointer; padding: 0;
  }
  .nav-dot.cur { outline: 2px solid var(--primary); color: var(--text); font-weight: 700; }
  .nav-dot.ok { background: var(--correct-bg); color: var(--correct); border-color: var(--correct); }
  .nav-dot.ng { background: var(--wrong-bg); color: var(--wrong); border-color: var(--wrong); }
  .browse-item { border-top: 1px solid var(--border); padding: 16px 0; }
  .browse-item:first-child { border-top: none; padding-top: 4px; }
  .browse-item .q-text { font-size: 1rem; }
  .browse-choices { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .browse-choice { display: flex; gap: 8px; padding: 6px 10px; border-radius: 8px; font-size: 0.95rem; }
  .browse-choice .mark { color: var(--primary); font-weight: 700; flex-shrink: 0; }
  .browse-choice.ans { background: var(--correct-bg); color: var(--correct); font-weight: 500; }
  .browse-choice.ans .mark { color: var(--correct); }
  .browse-item .explain { margin-top: 8px; font-size: 0.9rem; }
  .toggle-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 0.9rem; }
  .sticky-top { position: sticky; top: 0; background: var(--surface); padding: 6px 0 8px; z-index: 2; }
  .table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); border-radius: 10px; -webkit-overflow-scrolling: touch; }
  .table-cap { font-size: 0.8rem; color: var(--muted); padding: 9px 11px 2px; }
  .data-table { border-collapse: collapse; width: 100%; font-size: 0.76rem; }
  .data-table th, .data-table td { padding: 6px 11px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table th { background: var(--surface-2); text-align: left; font-weight: 500; color: var(--muted); }
  .data-table th.num, .data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .data-table tr.row-bold { background: var(--surface-2); }
  .data-table tr.row-bold td { font-weight: 700; }
  .data-table td.indent { padding-left: 24px; color: var(--muted); }
  .scroll-hint { font-size: 0.76rem; color: var(--muted); margin: -6px 0 10px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 id="title">HBS 13기 6모듈 재무 Final Test</h1>
    <p>연습용 모의고사 · 객관식 20문제(4지선다) + 주관식 5문제</p>
  </header>

  <!-- 1. 입장 -->
  <section id="gate" class="card">
    <label for="pw">입장 비밀번호</label>
    <input type="password" id="pw" placeholder="비밀번호를 입력하세요" autocomplete="off">
    <div class="error" id="pw-error"></div>
    <div class="btn-row">
      <button class="btn btn-primary grow" id="pw-btn">입장</button>
    </div>
  </section>

  <!-- 2. 시작 화면 -->
  <section id="lobby" class="card hidden">
    <div class="stats">
      <div class="stat"><div class="num" id="st-total">25</div><div class="lbl">전체 문제</div></div>
      <div class="stat"><div class="num" id="st-ready">0</div><div class="lbl">확인된 문제</div></div>
      <div class="stat"><div class="num" id="st-best">-</div><div class="lbl">최고 점수</div></div>
    </div>
    <div class="notice" id="ready-notice"></div>
    <div class="slot-grid" id="slot-grid"></div>

    <div class="option-group">
      <label class="radio-line"><input type="radio" name="order" value="seq" checked> 번호 순서대로 풀기</label>
      <label class="radio-line"><input type="radio" name="order" value="rand"> 무작위 순서로 풀기</label>
      <label class="radio-line"><input type="checkbox" id="opt-shuffle-choices"> 객관식 보기 순서도 섞기</label>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary grow" id="start-btn">시험 시작</button>
      <button class="btn grow" id="browse-btn">문제·정답 훑어보기</button>
    </div>
  </section>

  <!-- 2-1. 훑어보기 화면 -->
  <section id="browse" class="card hidden">
    <div class="sticky-top">
      <div class="toggle-row">
        <strong>전체 문제 · 정답 · 해설</strong>
        <label class="radio-line" style="margin-left:auto"><input type="checkbox" id="browse-hide-ans"> 정답 가리기</label>
      </div>
      <div class="btn-row" style="margin-top:0">
        <button class="btn" id="browse-home-btn">처음으로</button>
        <button class="btn btn-primary grow" id="browse-start-btn">시험 시작</button>
      </div>
    </div>
    <div id="browse-list"></div>
  </section>

  <!-- 3. 문제 화면 -->
  <section id="quiz" class="card hidden">
    <div class="progress-wrap">
      <span id="prog-text"></span>
      <span id="prog-score"></span>
    </div>
    <div class="bar"><div id="prog-bar"></div></div>
    <div class="nav-strip" id="nav-strip"></div>

    <div class="q-head">
      <span class="badge type" id="q-type"></span>
      <span class="badge" id="q-no"></span>
      <span class="badge" id="q-diff"></span>
    </div>
    <div class="q-note hidden" id="q-note"></div>
    <div class="q-text" id="q-text"></div>
    <div id="q-table" class="hidden"></div>

    <div id="mc-area" class="choices"></div>

    <div id="short-area" class="hidden">
      <textarea id="short-input" placeholder="답안을 입력하세요"></textarea>
    </div>

    <div id="result" class="hidden">
      <div class="result-line" id="result-line"></div>
      <div class="selfgrade hidden" id="selfgrade">
        자동 채점 결과가 다르다면 직접 판정:
        <button class="btn" data-grade="1">정답 처리</button>
        <button class="btn" data-grade="0">오답 처리</button>
      </div>
      <div class="explain" id="explain"></div>
    </div>

    <div class="btn-row">
      <button class="btn" id="prev-btn">← 이전</button>
      <button class="btn btn-primary grow" id="check-btn" disabled>정답 확인</button>
      <button class="btn grow" id="next-btn">다음 →</button>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn grow" id="quit-btn">시험 종료 · 결과 보기</button>
    </div>
  </section>

  <!-- 4. 결과 화면 -->
  <section id="summary" class="card hidden">
    <div class="score-big" id="sum-score"></div>
    <div class="score-sub" id="sum-sub"></div>
    <div class="btn-row">
      <button class="btn btn-primary grow" id="retry-btn">다시 풀기</button>
      <button class="btn grow" id="retry-wrong-btn">틀린 문제만 다시 풀기</button>
      <button class="btn" id="home-btn">처음으로</button>
    </div>
    <h3 style="margin:22px 0 6px;">문제별 결과</h3>
    <div id="review"></div>
  </section>

  <footer>
    개인 학습용 · 해설은 강의 중 교수님 워딩을 기준으로 정리 ·
    <button class="link-btn" id="logout-btn">잠금</button>
  </footer>
</div>

<script src="questions.js"></script>
<script>
(function () {
  const PASSWORD = "HBS13";
  const SESSION_KEY = "hbs13_m6_auth";
  const BEST_KEY = "hbs13_m6_best";

  const META = window.QUIZ_META || { totalQuestions: 25, mcCount: 20, shortCount: 5 };
  const ALL = (window.QUIZ_QUESTIONS || []).slice().sort((a, b) => a.no - b.no);
  const MARKS = ["①", "②", "③", "④", "⑤"];

  const $ = (id) => document.getElementById(id);
  const show = (el) => el.classList.remove("hidden");
  const hide = (el) => el.classList.add("hidden");

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function safeDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // ---------- 상태 ----------
  let queue = [];      // 이번 회차에 풀 문제 목록 (보기 섞기 반영)
  let idx = 0;
  let answers = [];    // { q, picked, correct, text }
  let selected = null; // 현재 객관식 선택 인덱스
  let checked = false;

  // ---------- 입장 ----------
  function tryLogin() {
    const v = $("pw").value.trim();
    if (v === PASSWORD) {
      safeSet(SESSION_KEY, "1");
      $("pw-error").textContent = "";
      $("pw").value = "";
      openLobby();
    } else {
      $("pw-error").textContent = "비밀번호가 올바르지 않습니다.";
      $("pw").focus();
    }
  }
  $("pw-btn").addEventListener("click", tryLogin);
  $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
  $("logout-btn").addEventListener("click", () => {
    safeDel(SESSION_KEY);
    [ $("lobby"), $("quiz"), $("summary"), $("browse") ].forEach(hide);
    show($("gate"));
    $("pw").focus();
  });

  // ---------- 로비 ----------
  function openLobby() {
    hide($("gate")); hide($("quiz")); hide($("summary")); hide($("browse"));
    show($("lobby"));
    $("st-total").textContent = META.totalQuestions;
    $("st-ready").textContent = ALL.length;
    const best = safeGet(BEST_KEY);
    $("st-best").textContent = best ? `${best}%` : "-";

    const mc = ALL.filter(q => q.type === "mc").length;
    const sh = ALL.filter(q => q.type === "short").length;
    const remain = META.totalQuestions - ALL.length;
    $("ready-notice").textContent = remain > 0
      ? `현재 ${ALL.length}문제(객관식 ${mc} · 주관식 ${sh})가 확인되어 있습니다. 나머지 ${remain}문제는 확인되는 대로 추가됩니다.`
      : `전체 ${ALL.length}문제(객관식 ${mc} · 주관식 ${sh})가 모두 준비되었습니다.`;

    const grid = $("slot-grid");
    grid.innerHTML = "";
    const readySet = new Set(ALL.map(q => q.no));
    for (let n = 1; n <= META.totalQuestions; n++) {
      const d = document.createElement("div");
      d.className = "slot" + (readySet.has(n) ? " ok" : "") + (n > META.mcCount ? " short" : "");
      d.textContent = n;
      d.title = readySet.has(n) ? "확인됨" : "미확인";
      grid.appendChild(d);
    }
    $("start-btn").disabled = ALL.length === 0;
  }

  // ---------- 데이터 표 ----------
  function buildTable(t) {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    if (t.caption) {
      const c = document.createElement("div");
      c.className = "table-cap";
      c.textContent = t.caption;
      wrap.appendChild(c);
    }
    const tbl = document.createElement("table");
    tbl.className = "data-table";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    (t.headers || []).forEach((h, i) => {
      const th = document.createElement("th");
      th.textContent = h;
      if (i > 0) th.className = "num";
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    tbl.appendChild(thead);
    const tb = document.createElement("tbody");
    (t.rows || []).forEach((r) => {
      const tr = document.createElement("tr");
      if (r.bold) tr.className = "row-bold";
      const td0 = document.createElement("td");
      td0.textContent = r.label;
      if (r.indent) td0.className = "indent";
      tr.appendChild(td0);
      (r.values || []).forEach((v) => {
        const td = document.createElement("td");
        td.className = "num";
        td.textContent = v;
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    wrap.appendChild(tbl);
    return wrap;
  }

  function attachTable(host, q) {
    host.innerHTML = "";
    if (!q.table) { hide(host); return; }
    host.appendChild(buildTable(q.table));
    const hint = document.createElement("div");
    hint.className = "scroll-hint";
    hint.textContent = "표가 잘리면 좌우로 밀어서 보세요.";
    host.appendChild(hint);
    show(host);
  }

  // ---------- 훑어보기 ----------
  function openBrowse() {
    hide($("lobby")); hide($("quiz")); hide($("summary")); hide($("gate"));
    show($("browse"));
    renderBrowse();
    window.scrollTo({ top: 0 });
  }
  function renderBrowse() {
    const hideAns = $("browse-hide-ans").checked;
    const list = $("browse-list");
    list.innerHTML = "";
    ALL.forEach((q) => {
      const d = document.createElement("div");
      d.className = "browse-item";
      const head = document.createElement("div");
      head.className = "q-head";
      head.innerHTML = `<span class="badge type"></span><span class="badge"></span><span class="badge"></span>`;
      const b = head.querySelectorAll(".badge");
      b[0].textContent = q.type === "mc" ? "객관식" : "주관식";
      b[1].textContent = `문제 ${q.no}`;
      b[2].textContent = q.difficulty ? `난이도 ${q.difficulty}` : "난이도 미확인";
      d.appendChild(head);
      if (q.note) { const n = document.createElement("div"); n.className = "q-note"; n.textContent = q.note; d.appendChild(n); }
      const qt = document.createElement("div"); qt.className = "q-text"; qt.textContent = q.question; d.appendChild(qt);
      if (q.table) { const tw = document.createElement("div"); attachTable(tw, q); d.appendChild(tw); }

      if (q.type === "mc") {
        const ch = document.createElement("div"); ch.className = "browse-choices";
        q.choices.forEach((c, i) => {
          const row = document.createElement("div");
          row.className = "browse-choice" + (!hideAns && i === q.answer ? " ans" : "");
          row.innerHTML = `<span class="mark"></span><span></span>`;
          row.firstChild.textContent = MARKS[i];
          row.lastChild.textContent = c;
          ch.appendChild(row);
        });
        d.appendChild(ch);
      }
      if (!hideAns) {
        const ex = document.createElement("div"); ex.className = "explain";
        if (q.type === "mc") {
          const a = document.createElement("div");
          a.innerHTML = "<strong>정답</strong>";
          a.appendChild(document.createTextNode(`${MARKS[q.answer]} ${q.choices[q.answer]}`));
          ex.appendChild(a); ex.appendChild(document.createElement("br"));
        } else {
          const a = document.createElement("div");
          a.innerHTML = "<strong>모범 답안</strong>";
          a.appendChild(document.createTextNode(q.model || (q.answers || []).join(", ")));
          ex.appendChild(a); ex.appendChild(document.createElement("br"));
        }
        const e = document.createElement("div");
        e.innerHTML = "<strong>해설</strong>";
        e.appendChild(document.createTextNode(q.explanation || "해설 미확인"));
        ex.appendChild(e);
        d.appendChild(ex);
      } else {
        const btn = document.createElement("button");
        btn.className = "link-btn"; btn.textContent = "정답 보기"; btn.style.marginTop = "6px";
        btn.addEventListener("click", () => {
          btn.remove();
          const ex = document.createElement("div"); ex.className = "explain";
          const ansText = q.type === "mc" ? `${MARKS[q.answer]} ${q.choices[q.answer]}` : (q.model || (q.answers || []).join(", "));
          const a = document.createElement("div");
          a.innerHTML = `<strong>${q.type === "mc" ? "정답" : "모범 답안"}</strong>`;
          a.appendChild(document.createTextNode(ansText));
          ex.appendChild(a); ex.appendChild(document.createElement("br"));
          const e = document.createElement("div");
          e.innerHTML = "<strong>해설</strong>";
          e.appendChild(document.createTextNode(q.explanation || "해설 미확인"));
          ex.appendChild(e);
          d.appendChild(ex);
          if (q.type === "mc") d.querySelectorAll(".browse-choice")[q.answer].classList.add("ans");
        });
        d.appendChild(btn);
      }
      list.appendChild(d);
    });
  }
  $("browse-btn").addEventListener("click", openBrowse);
  $("browse-home-btn").addEventListener("click", openLobby);
  $("browse-start-btn").addEventListener("click", () => startQuiz(ALL));
  $("browse-hide-ans").addEventListener("change", renderBrowse);

  // ---------- 시험 진행 ----------
  // answers[i] : null(미채점) 또는 { picked, text, correct }
  // drafts[i]  : 채점 전 임시 선택/입력 (뒤로 갔다 와도 유지)
  let drafts = [];

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function prepareQueue(source) {
    const order = document.querySelector('input[name="order"]:checked').value;
    const shuffleChoices = $("opt-shuffle-choices").checked;
    let list = order === "rand" ? shuffle(source) : source.slice().sort((a, b) => a.no - b.no);
    return list.map((q) => {
      if (q.type === "mc" && shuffleChoices) {
        const perm = shuffle(q.choices.map((_, i) => i));
        return { ...q, choices: perm.map(i => q.choices[i]), answer: perm.indexOf(q.answer), _orig: q };
      }
      return { ...q, _orig: q };
    });
  }

  function startQuiz(source) {
    if (!source.length) return;
    queue = prepareQueue(source);
    idx = 0;
    answers = queue.map(() => null);
    drafts = queue.map(() => null);
    hide($("lobby")); hide($("summary")); hide($("browse"));
    show($("quiz"));
    renderQuestion();
  }

  $("start-btn").addEventListener("click", () => startQuiz(ALL));

  function gradedCount() { return answers.filter(a => a).length; }
  function correctCount() { return answers.filter(a => a && a.correct).length; }

  function renderNavStrip() {
    const strip = $("nav-strip");
    strip.innerHTML = "";
    queue.forEach((q, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "nav-dot" + (i === idx ? " cur" : "") + (answers[i] ? (answers[i].correct ? " ok" : " ng") : "");
      b.textContent = i + 1;
      b.title = `문제 ${q.no}`;
      b.addEventListener("click", () => goTo(i));
      strip.appendChild(b);
    });
  }

  function goTo(i) {
    if (i < 0 || i >= queue.length) return;
    idx = i;
    renderQuestion();
  }

  function renderQuestion() {
    const q = queue[idx];
    const a = answers[idx];
    checked = !!a;
    selected = a ? a.picked : (drafts[idx] !== null && q.type === "mc" ? drafts[idx] : null);

    $("prog-text").textContent = `${idx + 1} / ${queue.length}`;
    $("prog-score").textContent = `정답 ${correctCount()} / 채점 ${gradedCount()}`;
    $("prog-bar").style.width = `${(gradedCount() / queue.length) * 100}%`;
    renderNavStrip();

    $("q-type").textContent = q.type === "mc" ? "객관식" : "주관식";
    $("q-no").textContent = `문제 ${q.no}`;
    $("q-diff").textContent = q.difficulty ? `난이도 ${q.difficulty}` : "난이도 미확인";
    $("q-text").textContent = q.question;
    if (q.note) { $("q-note").textContent = q.note; show($("q-note")); } else { hide($("q-note")); }
    attachTable($("q-table"), q);

    hide($("result")); hide($("selfgrade"));
    $("prev-btn").disabled = idx === 0;
    $("next-btn").disabled = idx === queue.length - 1;

    if (q.type === "mc") {
      show($("mc-area")); hide($("short-area"));
      const area = $("mc-area");
      area.innerHTML = "";
      q.choices.forEach((c, i) => {
        const b = document.createElement("button");
        b.className = "choice";
        b.type = "button";
        b.innerHTML = `<span class="mark">${MARKS[i]}</span><span></span>`;
        b.lastChild.textContent = c;
        if (!checked && selected === i) b.classList.add("selected");
        if (checked) {
          b.disabled = true;
          if (i === q.answer) b.classList.add("correct");
          else if (i === a.picked) b.classList.add("wrong");
        }
        b.addEventListener("click", () => {
          if (checked) return;
          selected = i; drafts[idx] = i;
          area.querySelectorAll(".choice").forEach((el, k) => el.classList.toggle("selected", k === i));
          $("check-btn").disabled = false;
        });
        area.appendChild(b);
      });
      $("check-btn").disabled = checked || selected === null;
    } else {
      hide($("mc-area")); show($("short-area"));
      const ta = $("short-input");
      ta.value = checked ? (a.text || "") : (drafts[idx] || "");
      ta.disabled = checked;
      $("check-btn").disabled = checked;
      if (!checked) setTimeout(() => ta.focus(), 50);
    }

    if (checked) {
      show($("check-btn"));
      $("check-btn").textContent = "채점 완료";
      showResult(q, a.correct, false);
      if (q.type === "short") show($("selfgrade"));
    } else {
      $("check-btn").textContent = "정답 확인";
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function normalize(s) {
    return (s || "").toLowerCase().replace(/[\s\.,、·\-_/()\[\]{}'"“”‘’!?:;~]/g, "");
  }

  function gradeShort(q, text) {
    const t = normalize(text);
    if (!t) return false;
    return (q.answers || []).some(a => { const n = normalize(a); return n && t.includes(n); });
  }

  function checkAnswer() {
    if (checked) return;
    const q = queue[idx];
    let correct, picked = null, text = null;

    if (q.type === "mc") {
      if (selected === null) return;
      picked = selected;
      correct = selected === q.answer;
      $("mc-area").querySelectorAll(".choice").forEach((b, i) => {
        b.disabled = true;
        if (i === q.answer) b.classList.add("correct");
        else if (i === selected) b.classList.add("wrong");
      });
    } else {
      text = $("short-input").value;
      $("short-input").disabled = true;
      correct = gradeShort(q, text);
      show($("selfgrade"));
    }
    checked = true;
    answers[idx] = { picked, text, correct };
    $("check-btn").disabled = true;
    $("check-btn").textContent = "채점 완료";
    $("prog-score").textContent = `정답 ${correctCount()} / 채점 ${gradedCount()}`;
    $("prog-bar").style.width = `${(gradedCount() / queue.length) * 100}%`;
    renderNavStrip();
    showResult(q, correct, true);
  }

  function showResult(q, correct, focusNext) {
    const line = $("result-line");
    line.className = "result-line " + (correct ? "ok" : "ng");
    if (q.type === "mc") {
      line.textContent = correct ? "정답입니다!" : `오답입니다. 정답은 ${MARKS[q.answer]}번입니다.`;
    } else {
      line.textContent = correct ? "정답으로 판정되었습니다." : "오답으로 판정되었습니다. 모범 답안과 비교해 보세요.";
    }
    const ex = $("explain");
    ex.innerHTML = "";
    if (q.type === "short" && q.model) {
      const m = document.createElement("div");
      m.innerHTML = "<strong>모범 답안</strong>";
      m.appendChild(document.createTextNode(q.model));
      ex.appendChild(m);
      ex.appendChild(document.createElement("br"));
    }
    const e = document.createElement("div");
    e.innerHTML = "<strong>해설</strong>";
    e.appendChild(document.createTextNode(q.explanation || "해설 미확인"));
    ex.appendChild(e);
    show($("result"));
    if (focusNext) {
      if (idx === queue.length - 1) $("quit-btn").focus(); else $("next-btn").focus();
    }
  }

  $("selfgrade").querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => {
      const a = answers[idx];
      if (!a) return;
      a.correct = b.dataset.grade === "1";
      $("prog-score").textContent = `정답 ${correctCount()} / 채점 ${gradedCount()}`;
      renderNavStrip();
      showResult(queue[idx], a.correct, false);
    });
  });

  $("check-btn").addEventListener("click", checkAnswer);
  $("short-input").addEventListener("input", (e) => { if (!checked) drafts[idx] = e.target.value; });
  $("short-input").addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") checkAnswer();
  });
  $("prev-btn").addEventListener("click", () => goTo(idx - 1));
  $("next-btn").addEventListener("click", () => goTo(idx + 1));
  $("quit-btn").addEventListener("click", () => {
    const left = queue.length - gradedCount();
    if (gradedCount() === 0) {
      if (confirm("아직 채점한 문제가 없습니다. 시험을 종료하고 처음으로 돌아갈까요?")) openLobby();
      return;
    }
    if (left === 0 || confirm(`아직 채점하지 않은 문제가 ${left}개 있습니다. 채점하지 않은 문제는 오답으로 처리됩니다. 종료할까요?`)) finish();
  });

  // ---------- 결과 ----------
  function finish() {
    hide($("quiz")); show($("summary"));
    const total = queue.length;
    const correct = correctCount();
    const pct = total ? Math.round((correct / total) * 100) : 0;
    $("sum-score").textContent = `${correct} / ${total}`;
    $("sum-sub").textContent = `정답률 ${pct}% · 채점 ${gradedCount()} / ${total}`;

    if (total === ALL.length && total > 0) {
      const prev = safeGet(BEST_KEY);
      const prevPct = prev ? parseInt(prev, 10) : -1;
      if (pct > prevPct) safeSet(BEST_KEY, String(pct));
    }

    const review = $("review");
    review.innerHTML = "";
    queue.forEach((q, i) => {
      const a = answers[i];
      const d = document.createElement("div");
      d.className = "review-item";
      const head = document.createElement("div");
      head.className = "rq";
      head.textContent = `${a ? (a.correct ? "✅" : "❌") : "⬜"} 문제 ${q.no}. ${q.question}`;
      d.appendChild(head);
      const ra = document.createElement("div");
      ra.className = "ra";
      if (q.type === "mc") {
        ra.innerHTML = "정답: <span></span> · 내 답: <span></span>";
        ra.querySelectorAll("span")[0].textContent = `${MARKS[q.answer]} ${q.choices[q.answer]}`;
        ra.querySelectorAll("span")[1].textContent = a && a.picked !== null ? `${MARKS[a.picked]} ${q.choices[a.picked]}` : "(미채점)";
      } else {
        ra.innerHTML = "모범 답안: <span></span><br>내 답: <span></span>";
        ra.querySelectorAll("span")[0].textContent = q.model || (q.answers || []).join(", ");
        ra.querySelectorAll("span")[1].textContent = a ? (a.text || "-") : "(미채점)";
      }
      d.appendChild(ra);
      review.appendChild(d);
    });
    $("retry-wrong-btn").disabled = correct === total;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("retry-btn").addEventListener("click", () => startQuiz(ALL));
  $("retry-wrong-btn").addEventListener("click", () => {
    const wrong = queue.filter((q, i) => !(answers[i] && answers[i].correct)).map(q => q._orig || q);
    startQuiz(wrong);
  });
  $("home-btn").addEventListener("click", openLobby);

  // ---------- 초기화 ----------
  document.title = "HBS13 재무 Final Test";
  if (META.title) $("title").textContent = META.title;
  if (safeGet(SESSION_KEY) === "1") openLobby();
  else $("pw").focus();
})();
</script>
</body>
</html>
